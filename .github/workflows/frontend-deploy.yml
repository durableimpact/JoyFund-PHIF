name: Frontend Deployment

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH (sshpass)
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.USER }}@${{ secrets.HOST }} << 'ENDSSH'
            # Navigate to the project root
            cd /root/projects/JoyFund/frontend

            # Forced sync with main branch
            git fetch origin main
            git reset --hard origin/main

            # Deploy frontend using docker-compose

            echo "🏗️   Rebuilding frontend..."
            docker compose --env-file .env build
            echo "🚀  Restarting frontend (2 replicas)..."
            docker compose --env-file .env up -d --scale app=2


            # Optional: Clean up unused images to save space
            docker image prune -f
          ENDSSH
