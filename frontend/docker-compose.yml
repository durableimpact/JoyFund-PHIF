services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        NEXT_PUBLIC_DJANGO_API_URL: ${NEXT_PUBLIC_DJANGO_API_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_DJANGO_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_DJANGO_OAUTH_CLIENT_ID}
        NEXT_PUBLIC_DJANGO_OAUTH_CLIENT_SECRET: ${NEXT_PUBLIC_DJANGO_OAUTH_CLIENT_SECRET}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "3000"
    networks:
      - joyfund_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
      rollback_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  joyfund_network:
    external: true
