name: joyfund

services:

  # ──── Postgres (Database) ──────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: joyfund_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Database Backup ────────────────────────────────
  db-backup:
    image: python:3.13-alpine
    container_name: joyfund_backup
    restart: unless-stopped
    env_file:
      - ./envs/prod/.env
    environment:
      DB_HOST: joyfund_postgres
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    entrypoint: >
      sh -c "
        apk add --no-cache postgresql-client &&
        pip install boto3==1.25.5 --quiet &&
        echo '0 2 * * * sh /backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
        echo '⏰ Backup scheduler started - runs daily at 2:00 AM UTC' &&
        crond -f -d 8
      "
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: joyfund_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    expose:
      - "80"
    networks:
      - joyfund_network
      - backend
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  # ─── RabbitMQ (Message Broker) ─────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine 
    container_name: joyfund_rabbitmq
    restart: unless-stopped
    env_file:
      - ./envs/prod/.env
    networks:
      - backend
    # healthcheck:
    #   test: ["CMD", "rabbitmq-diagnostics", "ping"]
    #   interval: 10s
    #   timeout: 15s
    #   retries: 5
    #   start_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl await_startup 2>/dev/null && echo OK || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 15m
        max-file: "5"

  # ─── Redis (Cache + Celery Broker) ─────────────────
  redis:
    image: redis:7.4
    container_name: joyfund_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s 
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Django Web Workers ─────────────────────────────
  web-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: joyfund_web_1
    restart: unless-stopped
    env_file:
      - ./envs/prod/.env
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - static_volume:/app/static
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:           # ← add this
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - joyfund_network
      - backend
    command: >
      gunicorn
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 120
      --access-logfile -
      --error-logfile -
      backend.asgi:application
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web-worker-2:
    extends: web-worker-1
    container_name: joyfund_web_2
    environment:
      RUN_MIGRATIONS: "false"
    networks:
      - joyfund_network
      - backend

  # ─── Celery Workers (Async Tasks) ──────────────────
  celery-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: joyfund_celery_1
    restart: unless-stopped
    env_file:
      - ./envs/prod/.env
    volumes:
      - static_volume:/app/static
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A joyfund worker
      -n worker1@%h
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
      --time-limit=3600
      --soft-time-limit=3300
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 750M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  celery-worker-2:
    extends: celery-worker-1
    container_name: joyfund_celery_2
    command: >
      celery -A joyfund worker
      -n worker2@%h
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
      --time-limit=3600
      --soft-time-limit=3300
    networks:
      - backend

  # ─── Celery Beat (Scheduled Tasks) ─────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: joyfund_celery_beat
    restart: unless-stopped
    env_file:
      - ./envs/prod/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A joyfund beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Prometheus (Metrics Collection) ───────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: joyfund_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - joyfund_network     # NPM proxies prometheus.joyfund.cm here
      - backend             # scrapes Django workers metrics
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Grafana (Metrics + Logs Dashboard) ────────────
  grafana:
    image: grafana/grafana:latest
    container_name: joyfund_grafana
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki                # ← wait for Loki before starting
    networks:
      - joyfund_network     # NPM proxies grafana.joyfund.cm here
      - backend             # reaches Prometheus and Loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Loki (Log Storage) ────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: joyfund_loki
    restart: unless-stopped
    expose:
      - "3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - joyfund_network     # Grafana reaches Loki here
      - backend             # Promtail ships logs here
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Promtail (Log Collector) ───────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: joyfund_promtail
    restart: unless-stopped
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro    # your config file
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # all container logs
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker metadata
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki                # ← wait for Loki before shipping logs
    networks:
      - backend             # ships logs to Loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  backup_data:
  postgres_data:
  pgadmin_data:
  static_volume:
    name: joyfund_static_volume    # ← same name
    external: true                 # ← already exists, just reference it

networks:
  joyfund_network:
    external: true        # shared with NPM and frontend
  backend:
    external: true        # Redis, RabbitMQ, Loki never exposed to internet
    name: backend_backend