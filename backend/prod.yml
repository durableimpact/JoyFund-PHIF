services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    env_file:
    - ./envs/prod/.env
    environment:
      POSTGRES_INITDB_ARGS: -c shared_buffers=256MB -c effective_cache_size=1GB -c
        max_connections=500 -c work_mem=50MB
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U joyfund -d joyfund
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  rabbitmq:
    image: rabbitmq:3.10-management-alpine
    restart: unless-stopped
    env_file:
    - ./envs/prod/.env
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 15m
        max-file: '5'
  redis:
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --appendonly
      yes --appendfsync everysec
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
    - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - static_volume:/app/static:ro
    - media_volume:/app/media:ro
    depends_on:
    - web-worker-1
    - web-worker-2
    - web-worker-3
    - web-worker-4
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  web-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - ./envs/prod/.env
    volumes:
    - .:/app
    - media_volume:/app/media
    - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
    - '8000'
    networks:
    - frontend
    - backend
    command: gunicorn --config gunicorn_config.py --bind 0.0.0.0:8000 --workers 8
      --worker-class sync --max-requests 1000 --max-requests-jitter 100 --timeout
      30 --access-logfile - --error-logfile - backend.wsgi:application
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
  web-worker-2:
    extends: web-worker-1
    expose:
    - '8000'
    networks:
    - frontend
    - backend
  web-worker-3:
    extends: web-worker-1
    expose:
    - '8000'
    networks:
    - frontend
    - backend
  web-worker-4:
    extends: web-worker-1
    expose:
    - '8000'
    networks:
    - frontend
    - backend
  celery-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - ./envs/prod/.env
    volumes:
    - .:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend worker -n worker1@%h --loglevel=info --concurrency=4
      --max-tasks-per-child=1000 --time-limit=3600 --soft-time-limit=3300
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
    - backend
  celery-worker-2:
    extends: celery-worker-1
    command: celery -A backend worker -n worker2@%h --loglevel=info --concurrency=4
      --max-tasks-per-child=1000 --time-limit=3600 --soft-time-limit=3300
    networks:
    - backend
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - ./envs/prod/.env
    volumes:
    - .:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - backend
volumes:
  pgdata: null
  redis_data: null
  media_volume: null
  static_volume: null
networks:
  frontend: null
  backend:
    internal: true
