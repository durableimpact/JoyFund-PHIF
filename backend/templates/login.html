<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - JoyFund PHIF</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --accent-2: #06b6d4;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
      --error: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.25), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(6, 182, 212, 0.22), transparent 40%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .container {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      backdrop-filter: blur(8px);
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    }

    .header {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.04);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .highlight {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .content {
      padding: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: linear-gradient(90deg, var(--accent), #16a34a);
      color: white;
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.3);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(34, 197, 94, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 16px 22px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      background: rgba(0, 0, 0, 0.18);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <span class="badge">JoyFund PHIF</span>
      <h1>Sign in to <span class="highlight">continue</span></h1>
      <p class="subtitle">Access API documentation and admin features</p>
    </div>
    
    <div class="content">
      {% if error %}
      <div class="error-message">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />
        
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            autofocus
            autocomplete="email"
            placeholder="Enter your email"
          />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required
            autocomplete="current-password"
            placeholder="Enter your password"
          />
        </div>
        
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
    
    <footer class="footer">
      <a href="/">← Back to home</a>
    </footer>
  </main>
</body>
</html>
