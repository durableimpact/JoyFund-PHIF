global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "django-web-1"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["joyfund_web_1:8000"]
    http_headers:
      Host:
        - "api.joy-fund.com"

  - job_name: "django-web-2"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["joyfund_web_2:8000"]
    http_headers:
      Host:
        - "api.joy-fund.com"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]