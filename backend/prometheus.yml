global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "django-web"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "web-worker-1:8000"
          - "web-worker-2:8000"
          - "web-worker-3:8000"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]