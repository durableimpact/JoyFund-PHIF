services:

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL + PostGIS  (official image: postgis/postgis:17-3.5-alpine3.20)
  # ────────────────────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: joyfund
      POSTGRES_USER: joyfund
      POSTGRES_PASSWORD: joyfund
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyfund -d joyfund"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Redis  (Celery message broker  —  local image: redis:7.4)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ────────────────────────────────────────────────────────────────────────────
  # Django web server
  # ────────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: django-insecure-qdt8$$ejtchowb+mz_2)e8+ind*l0q_*%fpb4ku^=hegbxs$$zcm
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost 127.0.0.1 0.0.0.0"
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: joyfund
      DB_USER: joyfund
      DB_PASSWORD: joyfund
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ${SOCIAL_AUTH_GOOGLE_OAUTH2_KEY:-}
      SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ${SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET:-}
      SOCIAL_AUTH_GOOGLE_OAUTH2_WHITELISTED_DOMAINS: ${SOCIAL_AUTH_GOOGLE_OAUTH2_WHITELISTED_DOMAINS:-}
      OAUTH2_ACCESS_TOKEN_EXPIRE_SECONDS: ${OAUTH2_ACCESS_TOKEN_EXPIRE_SECONDS:-36000}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Celery worker
  # ────────────────────────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: joyfund
      DB_USER: joyfund
      DB_PASSWORD: joyfund
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend worker --loglevel=info --concurrency=2
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Celery beat  (periodic tasks scheduler)
  # ────────────────────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: joyfund
      DB_USER: joyfund
      DB_PASSWORD: joyfund
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  pgdata:
  media_volume:
  static_volume:


