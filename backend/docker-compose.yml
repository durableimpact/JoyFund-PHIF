services:

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL + PostGIS  (optimized for 1M+ users/day, 50k peak req/sec)
  # ────────────────────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: joyfund
      POSTGRES_USER: joyfund
      POSTGRES_PASSWORD: joyfund
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c effective_cache_size=1GB -c max_connections=500 -c work_mem=50MB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyfund -d joyfund"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # RabbitMQ  (optimized for high throughput - 1M+ users/day)
  # ────────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: joyfund
      RABBITMQ_DEFAULT_PASS: joyfund
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Redis  (caching and Celery result backend - optimized for 1M users)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Nginx - Load Balancer & Reverse Proxy (handles 50k req/sec distribution)
  # ────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - web-worker-1
      - web-worker-2
      - web-worker-3
      - web-worker-4
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Django Gunicorn Workers (4 instances = 40+ concurrent req/sec per instance)
  # Total capacity: ~160+ req/sec = can handle 50k+ users/day peaks
  # ────────────────────────────────────────────────────────────────────────────
  web-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-qdt8$$ejtchowb+mz_2)e8+ind*l0q_*%fpb4ku^=hegbxs$$zcm}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: joyfund
      DB_USER: joyfund
      DB_PASSWORD: joyfund
      DB_HOST: db
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "600"
      CELERY_BROKER_URL: amqp://joyfund:joyfund@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CACHE_LOCATION: redis://redis:6379/2
      CHANNEL_LAYER_HOST: redis://redis:6379/0
      SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ${SOCIAL_AUTH_GOOGLE_OAUTH2_KEY:-}
      SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ${SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET:-}
      SOCIAL_AUTH_GOOGLE_OAUTH2_WHITELISTED_DOMAINS: ${SOCIAL_AUTH_GOOGLE_OAUTH2_WHITELISTED_DOMAINS:-}
      OAUTH2_ACCESS_TOKEN_EXPIRE_SECONDS: ${OAUTH2_ACCESS_TOKEN_EXPIRE_SECONDS:-36000}
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: gunicorn --config gunicorn_config.py --bind 0.0.0.0:8000 --workers 8 --worker-class sync --max-requests 1000 --max-requests-jitter 100 --timeout 30 --access-logfile - --error-logfile - backend.wsgi:application
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web-worker-2:
    extends: web-worker-1
    expose:
      - "8000"

  web-worker-3:
    extends: web-worker-1
    expose:
      - "8000"

  web-worker-4:
    extends: web-worker-1
    expose:
      - "8000"

  # ────────────────────────────────────────────────────────────────────────────
  # Celery Workers (3 instances for high throughput)
  # ────────────────────────────────────────────────────────────────────────────
  celery-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: joyfund
      DB_USER: joyfund
      DB_PASSWORD: joyfund
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: amqp://joyfund:joyfund@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend worker -l INFO --concurrency=4 -n worker1@%h
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  celery-worker-2:
    extends: celery-worker-1
    command: celery -A backend worker -l INFO --concurrency=4 -n worker2@%h

  celery-worker-3:
    extends: celery-worker-1
    command: celery -A backend worker -l INFO --concurrency=4 -n worker3@%h

  # ────────────────────────────────────────────────────────────────────────────
  # Celery Beat (periodic tasks scheduler - only 1 instance)
  # ────────────────────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: joyfund
      DB_USER: joyfund
      DB_PASSWORD: joyfund
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: amqp://joyfund:joyfund@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Prometheus (Metrics Monitoring)
  # ────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  # ────────────────────────────────────────────────────────────────────────────
  # Grafana (Metrics Dashboard)
  # ────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

volumes:
  pgdata:
  redis_data:
  media_volume:
  static_volume:
  prometheus_data:
  grafana_data:
